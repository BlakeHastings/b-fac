# The mechanical gate. Everything here is the price of admission, not a review
# lens: if it is red the work is not ready to look at. See docs/process/review.md.
#
# The job `name:` below is what GitHub reports in the check rollup, and it is
# what scripts/merge-pr.mjs matches on and what the ruleset requires. Renaming
# the job silently turns "never ran" into a refused merge, so change all three
# together.
name: checks

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Nothing here needs to write to the repo, and a public
# repo should not hand a write token to a workflow that does not use one.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-vocabulary.mjs enumerates files with `git ls-files`, which
          # needs a real working tree rather than a sparse or shallow one.
          #
          # 0 rather than 1 because check-version-bump.mjs asks what this branch
          # changed relative to the merge base with main, and a shallow clone
          # has no merge base to find. It fails loudly in that case rather than
          # passing, so lowering this back to 1 reds the build rather than
          # quietly disabling the check.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependencies on purpose, so there is no install step and no
      # lockfile to drift. node:test and node:assert are enough. If that ever
      # stops being true, add `npm ci` here and commit the lockfile.
      - name: Guard tests
        run: npm test

      # `.claude/skills/` is generated from `.agents/skills/`. This is the gate
      # that stops the copy Claude actually reads from silently going stale.
      - name: Harness mirror in sync
        run: npm run check:sync

      - name: Vocabulary
        run: npm run check:vocabulary

      # Only means anything against the merge result: a branch adding 0009 is
      # fine alone and collides once main has one too. `pull_request` checks
      # out the merge commit, which is what makes this catch anything.
      - name: ADR collisions
        run: npm run check:collisions

      # A step inside this job rather than a job of its own, deliberately. A new
      # job name becomes a third required check context, which is a third copy
      # of a string already duplicated across this file, merge-pr.mjs's
      # REQUIRED array and the ruleset. See docs/architecture/decisions/0009.
      #
      # On a `push` to main the merge base is main itself, the diff is empty and
      # this reports "no payload changed". It only has anything to say on a
      # pull request, which is where the bump can still be added.
      - name: Version bump for payload changes
        run: npm run check:version

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned deliberately. The CLI's Zod definitions are the actual spec —
      # there is no schema to validate against, the SchemaStore one is
      # generated and months stale — so `latest` means a spec change reds the
      # build with no commit of ours to explain it. Bump this on purpose.
      #
      # Verified locally on this version that validation descends into
      # plugin.json for a root-sourced (`./`) plugin, by breaking `keywords`
      # and watching it fail with `plugins[0] plugin.json → ...`. Before
      # trusting a newer version, re-run that check: a validator that silently
      # stops descending passes everything.
      #
      # Installed globally rather than invoked through npx so that the two
      # steps below share one pinned copy and run the same npm scripts a
      # developer runs. The version lives here and nowhere else.
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.226

      - name: Validate manifests
        run: npm run check:plugin

      # Both steps are in this one job on purpose. A separate job would be a
      # third required check context, which means a third copy of a job name to
      # keep in step with scripts/merge-pr.mjs and the ruleset. Neither step
      # needs credentials, so a fork's pull_request run gets the same answer as
      # a branch's.
      - name: Plugin loads and exposes its skills
        run: npm run check:plugin-load
